<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="choiceGlowA" x1="12" y1="36" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="choiceGlowB" x1="12" y1="24" x2="52" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="choiceSpark" x1="24" y1="8" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="choiceBacklightFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Underglow -->
  <ellipse cx="32" cy="46" rx="20" ry="6" fill="#A855F7" fill-opacity="0.3" filter="url(#choiceBacklightFilter)" />

  <!-- Layer 1: Study Materials Card (Foundation) -->
  <path d="M14 40L32 48L50 40L32 32L14 40Z" 
        fill="url(#choiceGlowA)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.5" />
  <path d="M14 40V44L32 52L50 44V40L32 48L14 40Z" 
        fill="#3B0764" fill-opacity="0.8" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Layer 2: Exam Syllabus Card (Floating elevation) -->
  <path d="M16 29L32 37L48 29L32 21L16 29Z" 
        fill="url(#choiceGlowB)" stroke="#C084FC" stroke-width="1.5" />
  
  <!-- Checklist Tracks on Syllabus Card -->
  <line x1="25" y1="28" x2="31" y2="31" stroke="#F3E8FF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="33" y1="32" x2="39" y2="29" stroke="#F3E8FF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Connecting Energy Beams (Materials -> Syllabus -> Question Engine) -->
  <line x1="32" y1="21" x2="32" y2="15" stroke="#E879F9" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8" />

  <!-- Layer 3: The Question Spark / Star (Exam Question Generator) -->
  <!-- Backlit Aura for the Spark -->
  <circle cx="32" cy="14" r="8" fill="#D946EF" fill-opacity="0.25" filter="url(#choiceBacklightFilter)" />

  <!-- Dynamic 4-Point Question Star -->
  <path d="M32 5C32 10 34 12 39 14C34 16 32 18 32 23C32 18 30 16 25 14C30 12 32 10 32 5Z" 
        fill="url(#choiceSpark)" filter="url(#choiceBacklightFilter)" />
  
  <!-- Core Brilliant Light Node -->
  <circle cx="32" cy="14" r="2.2" fill="#FFFFFF" />

  <!-- Floating Question Hook Sparkle -->
  <circle cx="43" cy="8" r="1.5" fill="#F472B6" />
  <circle cx="21" cy="9" r="1.2" fill="#818CF8" />
</svg>
