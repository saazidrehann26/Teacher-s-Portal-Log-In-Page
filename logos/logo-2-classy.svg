<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="crestGrad" x1="10" y1="4" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="10" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="quillGrad" x1="26" y1="10" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="40%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="classyBacklight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scholarly Heraldic Shield Outer Frame -->
  <path d="M32 5L48 11V28C48 40.5 41 50.5 32 55C23 50.5 16 40.5 16 28V11L32 5Z" 
        stroke="url(#crestGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Inner Shield Inset Line -->
  <path d="M32 9L44 14V28C44 38 38.5 46.5 32 50.5C25.5 46.5 20 38 20 28V14L32 9Z" 
        stroke="url(#crestGrad)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Open Manuscript / Syllabus Scroll Pages -->
  <path d="M22 36C25.5 34.5 28.5 35 32 36.5C35.5 35 38.5 34.5 42 36V43C38.5 41.5 35.5 42 32 43.5C28.5 42 25.5 41.5 22 43V36Z" 
        fill="#9333EA" fill-opacity="0.25" stroke="url(#crestGrad)" stroke-width="1.5" stroke-linejoin="round" />
  
  <line x1="25" y1="38" x2="29" y2="38" stroke="#D8B4FE" stroke-width="1" stroke-linecap="round" />
  <line x1="25" y1="40.5" x2="28" y2="40.5" stroke="#D8B4FE" stroke-width="1" stroke-linecap="round" opacity="0.7" />

  <!-- Elegant Feather Quill (Creating Questions & Curating Material) -->
  <path d="M42 12C42 12 37 15 34 21C31 27 30 32 31 38L29 42L28 40C28 35 29 29 32 23C35 17 40 13 42 12Z" 
        fill="url(#quillGrad)" filter="url(#classyBacklight)" />
  <!-- Quill Spine -->
  <path d="M42 12C37 18 33 26 29 42" stroke="#581C87" stroke-width="0.8" stroke-linecap="round" />
  <!-- Quill Nib point -->
  <polygon points="29,42 27.5,44 28.5,41.5" fill="#EAB308" />

  <!-- Crown / Academic Star of Excellence -->
  <path d="M32 12L33.2 14.8L36 15.2L34 17.2L34.5 20L32 18.6L29.5 20L30 17.2L28 15.2L30.8 14.8L32 12Z" 
        fill="url(#goldGrad)" />
</svg>
